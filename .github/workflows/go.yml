name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    # NOTE: branch protection requires a status check named "Build" --
    # renaming this job silently blocks merging into main.
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v5
      with:
        # make build-static stamps the version via `git describe --tags`;
        # the default shallow checkout has no tags and would break it.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Tracks the go directive in go.mod, so CI's toolchain can never
        # drift from what the code declares.
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: make build-static

    - name: Test
      run: go test -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
