root = "."
tmp_dir = "tmp"
[build]
bin = "./build/gin-workers workers"
cmd = "IKUZOMODULE=`go list -m`; IKUZOLDFLAGS=\"-X ${IKUZOMODULE}/cmd.version=`git describe --abbrev=0 --tags` -X ${IKUZOMODULE}/cmd.buildStamp=`date '+%Y-%m-%d_%I:%M:%S%p'` -X ${IKUZOMODULE}/cmd.gitHash=`git describe --match=NeVeRmAtCh --always --abbrev=40 --dirty` -X ${IKUZOMODULE}/cmd.buildAgent=`git config user.email`\"; go build -tags=dev -race -ldflags \"${IKUZOLDFLAGS}\" -o ./build/gin-workers ./ikuzo/ikuzoctl"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "tpl", "tmpl", "templ", "html"]
kill_delay = "0s"
log = "build-errors-workers.log"
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true

[server]
port = 3010
